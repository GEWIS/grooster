name: Semantic Release
on:
  push:
    branches:
      - main
jobs:
  versioning:
    uses: GEWIS/actions/.github/workflows/versioning.yml@v1

  release-server:
    uses: GEWIS/actions/.github/workflows/docker-release.yml@v1.11
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    with:
      projects: "['backend']"
      github-registry: 'true'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-paths: "['eou/grooster-backend']"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_ABCEOU_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_ABCEOU_PWD }}

  release-frontend:
    uses: GEWIS/actions/.github/workflows/docker-release.yml@v1.11
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    with:
      projects: "['frontend']"
      version: ${{ needs.versioning.outputs.next-version }}
      github-registry: 'true'
      docker-paths: "['eou/grooster-frontend']"
      # The frontend Dockerfile needs the local generated client, which is outside its context
      build-contexts: 'grooster-client=packages/grooster-client'
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_ABCEOU_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_ABCEOU_PWD }}