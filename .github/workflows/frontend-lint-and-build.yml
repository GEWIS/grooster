name: Frontend - Lint and Build
on:
    push:
        branches:
            - develop
        paths:
            - 'frontend/**'
            - 'packages/grooster-client/**'
            - '.github/workflows/frontend-lint-and-build.yml'
    pull_request:
        branches:
            - develop
        paths:
            - 'frontend/**'
            - 'packages/grooster-client/**'
            - '.github/workflows/frontend-lint-and-build.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-lint:
        uses: GEWIS/actions/.github/workflows/lint-and-build-npm.yml@v1
        with:
            node-version: '22.23.4'
            format: true
            working-directory: './frontend'
            # The frontend depends on the local generated client (file:../packages/grooster-client),
            # whose dist/ is not committed, so build it before the frontend installs.
            prepare-command: 'cd packages/grooster-client && npm ci && npm run build'
